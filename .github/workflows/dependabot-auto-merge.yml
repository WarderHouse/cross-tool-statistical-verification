name: Dependabot auto-merge

# Let routine dependency bumps clear themselves. For a Dependabot PR whose
# highest change is patch or minor, enable auto-merge so GitHub squash-merges it
# once the CI checks that main requires have passed. MAJOR bumps are left for a
# human, since they can break. There is no approval step: GitHub does not let
# Actions approve pull requests, and main requires no approvals.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge (patch/minor only)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL" \
            || echo "auto-merge not enabled (needs branch protection with required checks); leaving for manual merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
